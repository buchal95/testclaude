{% extends "base.html" %}
{% block title %}{{ 'Upravit' if contact else 'Nový' }} kontakt{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ 'Upravit kontakt' if contact else 'Nový kontakt' }}</h1>
</div>

<div class="card">
    <form method="post" action="{{ url_for('contact_edit', contact_id=contact.id) if contact else url_for('contact_new') }}">
        <div class="grid grid-2">
            <div class="form-group">
                <label>Jméno *</label>
                <input type="text" name="name" required value="{{ contact.name if contact else '' }}" placeholder="Celé jméno kontaktu">
            </div>
            <div class="form-group">
                <label>Kruh vztahu</label>
                <select name="circle">
                    {% for key, label in circle_labels.items() %}
                    <option value="{{ key }}" {{ 'selected' if contact and contact.circle == key }}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" value="{{ contact.email if contact and contact.email else '' }}" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Telefon</label>
                <input type="tel" name="phone" value="{{ contact.phone if contact and contact.phone else '' }}" placeholder="+420 ...">
            </div>
            <div class="form-group">
                <label>Firma</label>
                <input type="text" name="company" value="{{ contact.company if contact and contact.company else '' }}" placeholder="Název firmy">
            </div>
            <div class="form-group">
                <label>Pozice</label>
                <input type="text" name="role" value="{{ contact.role if contact and contact.role else '' }}" placeholder="Pracovní pozice">
            </div>
            <div class="form-group">
                <label>Jak jste se potkali</label>
                <input type="text" name="how_we_met" value="{{ contact.how_we_met if contact and contact.how_we_met else '' }}" placeholder="Konference, doporučení, ...">
            </div>
            <div class="form-group">
                <label>Zájmy</label>
                <input type="text" name="interests" value="{{ contact.interests if contact and contact.interests else '' }}" placeholder="Sport, technologie, ...">
            </div>
        </div>
        <div class="form-group">
            <label>Cíle (co pro něj/ni chceš udělat)</label>
            <input type="text" name="goals" value="{{ contact.goals if contact and contact.goals else '' }}" placeholder="Představit kolegu, doporučit knihu, ...">
        </div>
        <div class="form-group">
            <label>Poznámky</label>
            <textarea name="notes" placeholder="Volné poznámky ke kontaktu...">{{ contact.notes if contact and contact.notes else '' }}</textarea>
        </div>
        <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
            <button type="submit" class="btn btn-primary">{{ 'Uložit změny' if contact else 'Přidat kontakt' }}</button>
            <a href="{{ url_for('contact_detail', contact_id=contact.id) if contact else url_for('contacts') }}" class="btn">Zrušit</a>
        </div>
    </form>
</div>
{% endblock %}
