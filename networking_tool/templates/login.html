{% extends "base.html" %}
{% block title %}Prihlaseni{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Prihlaseni</h2>
        <p style="text-align: center; color: var(--text-dim); margin-bottom: 1.5rem;">Networking Tool - Nikdy Nejez Sam</p>
        <form method="post">
            <div class="form-group">
                <label>Uzivatelske jmeno</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Heslo</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Prihlasit se</button>
        </form>
        <p style="text-align: center; margin-top: 1rem; color: var(--text-dim);">
            Nemas ucet? <a href="{{ url_for('register') }}">Zaregistruj se</a>
        </p>
    </div>
</div>
{% endblock %}
