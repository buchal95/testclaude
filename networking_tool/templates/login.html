{% extends "base.html" %}
{% block title %}Přihlášení{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Přihlášení</h2>
        <p class="subtitle">GiveFirst — Buduj vztahy, které mají smysl</p>
        <form method="post">
            <div class="form-group">
                <label>Uživatelské jméno</label>
                <input type="text" name="username" required autofocus placeholder="Zadej uživatelské jméno">
            </div>
            <div class="form-group">
                <label>Heslo</label>
                <input type="password" name="password" required placeholder="Zadej heslo">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Přihlásit se</button>
        </form>
        <p class="auth-footer">
            Nemáš účet? <a href="{{ url_for('register') }}">Zaregistruj se</a>
        </p>
    </div>
</div>
{% endblock %}
