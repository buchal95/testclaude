{% extends "base.html" %}
{% block title %}Registrace{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Registrace</h2>
        <p style="text-align: center; color: var(--text-dim); margin-bottom: 1.5rem;">Vytvor si ucet a zacni budovat vztahy</p>
        <form method="post">
            <div class="form-group">
                <label>Uzivatelske jmeno *</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Zobrazovane jmeno</label>
                <input type="text" name="display_name" placeholder="Jak te mame oslovovat">
            </div>
            <div class="form-group">
                <label>Heslo * (min. 6 znaku)</label>
                <input type="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Heslo znovu *</label>
                <input type="password" name="password2" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Zaregistrovat se</button>
        </form>
        <p style="text-align: center; margin-top: 1rem; color: var(--text-dim);">
            Uz mas ucet? <a href="{{ url_for('login') }}">Prihlas se</a>
        </p>
    </div>
</div>
{% endblock %}
