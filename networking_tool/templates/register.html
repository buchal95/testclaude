{% extends "base.html" %}
{% block title %}Registrace{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Registrace</h2>
        <p class="subtitle">Vytvoř si účet a začni budovat vztahy</p>
        <form method="post">
            <div class="form-group">
                <label>Uživatelské jméno *</label>
                <input type="text" name="username" required autofocus placeholder="Zvol si uživatelské jméno">
            </div>
            <div class="form-group">
                <label>Zobrazované jméno</label>
                <input type="text" name="display_name" placeholder="Jak tě máme oslovovat">
            </div>
            <div class="form-group">
                <label>Heslo * (min. 6 znaků)</label>
                <input type="password" name="password" required minlength="6" placeholder="Zvol si heslo">
            </div>
            <div class="form-group">
                <label>Heslo znovu *</label>
                <input type="password" name="password2" required minlength="6" placeholder="Zopakuj heslo">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Zaregistrovat se</button>
        </form>
        <p class="auth-footer">
            Už máš účet? <a href="{{ url_for('login') }}">Přihlaš se</a>
        </p>
    </div>
</div>
{% endblock %}
